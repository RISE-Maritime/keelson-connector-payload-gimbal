[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-connector-payload-gimbal"
version = "0.1.0"
description = "A camera gimbal's own connector and payload gate: serves payload_control/v1 under the payload's PAYLOAD_AUTHORITY lease and payload_epoch, never through the motion gate (keelson payload_control)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # EXACT pin, never a path or a range. payload_control/v1, PayloadClearance and payloads[] are
    # keelson #360, still an open PR; 0.6.0-experimental.21 carries it (with #358, #359, #331, #332),
    # the build the motion gate and the safety supervisor pin. Tracked by crowsnest-dev #89.
    "keelson==0.6.0.dev21",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.14.11"]

[tool.setuptools]
packages = ["payload_gate", "payload_gate.driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs the CLI on an isolated loopback Zenoh router"]

[tool.ruff]
line-length = 140
